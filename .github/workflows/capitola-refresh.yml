# Reruns the Capitola flood model (capitola/model) twice a day and publishes its CSVs to
# kevinkeet.com/capitola. The model pulls live NOAA tides, CDIP waves, NWS rain and USGS creek data.
# Only the built-in GITHUB_TOKEN is used, so there are no secrets to set up.
name: Refresh Capitola flood data

on:
  schedule:
    # GitHub starts scheduled runs hours late (6-10 h in Oct-Nov 2026), so these land around late morning and
    # late evening Pacific time; the evening run keeps the next morning's high tide on a fresh swell forecast.
    - cron: '23 9 * * *'
    - cron: '23 1 * * *'
  workflow_dispatch:
    inputs:
      attempt:
        description: Attempt number (a failed run starts a fresh one, up to 3 in all)
        required: false
        default: '1'

permissions:
  contents: write
  actions: write    # lets a failed run start a fresh one, which lands on a different machine

concurrency:
  group: capitola-refresh
  cancel-in-progress: false

jobs:
  season:
    runs-on: ubuntu-24.04
    outputs:
      active: ${{ steps.check.outputs.active }}
    steps:
      - id: check
        # the model covers winter 2026-27; stop quietly after April instead of failing every day
        run: echo "active=$([ "$(date -u +%Y%m%d)" -le 20270430 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  refresh:
    needs: season
    if: needs.season.outputs.active == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash   # bash -eo pipefail: a model error inside `| tee` fails the step instead of publishing a partial run
        working-directory: capitola/model
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: capitola/model/requirements.txt

      - name: Install the model's packages
        run: pip install -r requirements.txt

      - name: Restore the CDIP wave hindcast (2000-2025, never changes)
        uses: actions/cache@v6
        with:
          path: capitola/model/data/*_hindcast.csv.gz
          key: cdip-mop-hindcast-SC111-SC113-v1

      - name: Fetch nearshore waves and recent Monterey water levels
        run: python fetch_data.py mop wlrecent

      - name: Rebuild the coastal tables
        run: python build_tables.py coastal

      - name: Run the forecast and outlook
        run: |
          python run_weekly.py | tee run.log
          { echo '### Capitola flood model'; echo '```'; cat run.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the new numbers
        run: |
          cp dash/*.csv ../data/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../data
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          run=$(sed -n '2p' dash/forecast_daily.csv | awk -F, '{print $NF}')
          git commit -q -m "Capitola: model run $run UTC"
          for attempt in 1 2 3; do
            git pull -q --rebase --autostash && git push -q && exit 0
            sleep 10
          done
          exit 1

  retry:
    # CDIP sometimes refuses a GitHub machine outright (HTTP 403 on Nov 3 and 12, 2026), and waiting on the same machine
    # never lifted it. A new run lands on a different machine, so a failed run starts another, up to 3 attempts in all.
    needs: refresh
    if: failure() && fromJSON(github.event.inputs.attempt || '1') < 3
    runs-on: ubuntu-24.04
    steps:
      - name: Start a fresh run
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ github.event.inputs.attempt || '1' }}
        run: |
          sleep 120
          gh workflow run capitola-refresh.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f attempt=$((ATTEMPT + 1))
          echo "Started attempt $((ATTEMPT + 1))" >> "$GITHUB_STEP_SUMMARY"
