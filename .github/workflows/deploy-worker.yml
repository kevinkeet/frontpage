# Deploys the Hold'em Coach API worker (poker/worker) to Cloudflare, sets its
# secrets, and points poker/index.html at the deployed URL.
#
# One-time setup, in the repo's Settings -> Secrets and variables -> Actions:
#   CLOUDFLARE_API_TOKEN   token from dash.cloudflare.com/profile/api-tokens ("Edit Cloudflare Workers" template)
#   CLOUDFLARE_ACCOUNT_ID  from the Workers & Pages overview page (right-hand sidebar)
#   ANTHROPIC_API_KEY      the shared Anthropic key
#   SITE_PASSWORD          the table password friends will type in
#
# Runs on every push that touches poker/worker, or by hand from the Actions tab.
name: Deploy Hold'em Coach worker

on:
  push:
    branches: [main]
    paths:
      - 'poker/worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: poker/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check secrets are present
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ] || missing="$missing ANTHROPIC_API_KEY"
          [ -n "${{ secrets.SITE_PASSWORD }}" ] || missing="$missing SITE_PASSWORD"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - name: Install wrangler
        run: npm install

      - name: Deploy the worker
        run: npx wrangler deploy 2>&1 | tee deploy.log

      - name: Set the worker's secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
          printf '%s' "$SITE_PASSWORD" | npx wrangler secret put SITE_PASSWORD

      - name: Point the app at the worker
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then echo "::warning::Could not find the worker URL in the deploy output"; exit 0; fi
          echo "Worker URL: $URL"
          cd ..
          if grep -q "window.__COACH_SERVER = '$URL';" index.html; then echo "index.html already points at $URL"; exit 0; fi
          sed -i "s#window.__COACH_SERVER = '[^']*';#window.__COACH_SERVER = '$URL';#" index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Point Hold'em Coach at the deployed worker ($URL)"
          git push
