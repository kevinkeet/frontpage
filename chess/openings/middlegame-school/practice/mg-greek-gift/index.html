",\"principle\":\"Attack with tempo\",\"wrongMoves\":{\"Qg4\":\"Eyeing g7 — but ...f5! blocks the diagonal and the attack stalls. Qh5 threatens mate in ONE (Qh7#), which permits no slow defense.\"}},{\"san\":\"Nf6\",\"explanation\":\"The only defense: the knight blocks the h5-h7 route by attacking your queen. It costs a piece — watch why.\"},{\"san\":\"exf6\",\"explanation\":\"The e5 pawn — the quiet hero of the checklist — removes the defender and renews Qh7# in the same move.\",\"principle\":\"Remove the defender\",\"wrongMoves\":{\"Qxf7\":\"Qxf7+?? Rxf7 and the attack is over — you're just down a bishop. The f6 knight is the problem; the e-pawn was built to remove it: exf6.\"}},{\"san\":\"Bxf6\",\"explanation\":\"Black regains the piece… and blocks his own king's last flight square in the process. Count the escape squares around g8: there are none.\"},{\"san\":\"Qh7#\",\"explanation\":\"Checkmate. f7 and f8 are blocked by Black's own pieces, h8 is covered, and the queen on h7 is protected by the g5 knight. Bishop for a king — the oldest trade in chess. Run the checklist before every Bxh7+ you ever play; when all five boxes tick, it simply works.\"}],\"plans\":[\"The checklist, forever: Bd3 ✓ Nf3 ✓ Qd1-h5 clear ✓ pawn e5 ✓ no ...Nf6 ✓ — sacrifice with confidence.\",\"If Black tries 2...Kg6 instead: Qd3+/Qg4 with f7/e6 collapsing — sharper but winning; know it exists before you sac.\",\"Missing a checklist item? Then Bxh7+ is just a blunder — the discipline IS the weapon.\"]}}]]}]}]\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[61428,[\"/chess/_next/static/chunks/0skawukeki9nb.js\",\"/chess/_next/static/chunks/0y48zonto-_31.js\",\"/chess/_next/static/chunks/41rdgncegt9c3.js\"],\"IconMark\"]\n9:null\ne:[[\"$\",\"title\",\"0\",{\"children\":\"Chess Trainer\"}],[\"$\",\"meta
